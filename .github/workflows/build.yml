name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build project
        run: dotnet build Mirchi.csproj --configuration Release

      - name: Verify dependency-light build
        shell: cmd
        run: build.cmd

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: mirchi-windows
          path: bin/Release/net48/Mirchi.exe
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Report Swift toolchain
        run: swift --version

      - name: Build app bundle
        working-directory: mac
        run: ./build-app.sh

      - name: Validate app bundle
        working-directory: mac
        run: |
          test -x Mirchi.app/Contents/MacOS/MirchiMac
          plutil -lint Mirchi.app/Contents/Info.plist

      - name: Package app bundle
        working-directory: mac
        run: ditto -c -k --sequesterRsrc --keepParent Mirchi.app Mirchi-macOS.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: mirchi-macos
          path: mac/Mirchi-macOS.zip
          if-no-files-found: error
